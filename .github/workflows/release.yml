# Release: pushing a v* tag builds all three platform artifacts in parallel and
# publishes them on a GitHub Release with auto-generated notes.
#   Proxy429-windows-x64.exe               (windows-latest, GUI subsystem via build.sh)
#   Proxy429-linux-x64.tar.gz              (ubuntu-latest, static CGO_ENABLED=0 binary + usage.md)
#   Proxy429-macOS-AppleSilicon-arm64.dmg  (macos-latest = Apple Silicon runner; build.sh assembles and
#                                           ad-hoc-signs Proxy429.app, then hdiutil packs a drag-to-Applications DMG)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build-windows:
    name: build-windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      - run: bash test/smoke/smoke.sh
      - run: bash test/smoke/exe-watchdog.sh
      - run: mv release/proxy429.exe release/Proxy429-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Proxy429-windows-x64.exe
          path: release/Proxy429-windows-x64.exe

  build-linux:
    name: build-linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      - run: bash test/smoke/smoke.sh
      # tar.gz keeps the executable bit, which plain artifact upload does not preserve.
      - run: tar -czf release/Proxy429-linux-x64.tar.gz -C release proxy429 usage.md
      - uses: actions/upload-artifact@v4
        with:
          name: Proxy429-linux-x64.tar.gz
          path: release/Proxy429-linux-x64.tar.gz

  build-macos:
    name: build-macos (Apple Silicon arm64)
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      - run: bash test/smoke/smoke.sh
      - name: Package DMG
        run: |
          mkdir -p dmg-staging
          cp -R release/Proxy429.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname Proxy429 -srcfolder dmg-staging -ov -format UDZO release/Proxy429-macOS-AppleSilicon-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Proxy429-macOS-AppleSilicon-arm64.dmg
          path: release/Proxy429-macOS-AppleSilicon-arm64.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      # Full history + tags so the notes step can diff against the previous release tag.
      # Must run BEFORE download-artifact: checkout defaults to clean: true (git clean -ffdx),
      # which would wipe the just-downloaded untracked dist/ directory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Proxy429-*
          merge-multiple: true
          path: dist
      # --generate-notes only summarizes merged PRs, and this repo pushes straight to main,
      # so it degenerated to a bare Full Changelog link. Build the notes from git log instead:
      # the commit list between the previous tag and this one, then the static download table
      # and the unsigned-app first-launch warning (same content as the README Download section).
      - name: Generate release notes
        run: |
          cur="${{ github.ref_name }}"
          prev="$(git describe --tags --abbrev=0 "${cur}^" 2>/dev/null || true)"
          {
            if [ -n "$prev" ]; then
              echo "## What changed since ${prev}"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${prev}..${cur}"
              echo
              echo
              echo "**Full diff**: https://github.com/${{ github.repository }}/compare/${prev}...${cur}"
            else
              echo "## What changed"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${cur}"
              echo
            fi
            echo
            echo "## Download"
            echo
            echo '| Platform | File |'
            echo '|---|---|'
            echo '| Windows x64 | `Proxy429-windows-x64.exe` |'
            echo '| Linux x64 | `Proxy429-linux-x64.tar.gz` (tar.gz keeps the executable bit) |'
            echo '| macOS Apple Silicon (arm64) | `Proxy429-macOS-AppleSilicon-arm64.dmg` |'
            echo
            echo '> **First launch warning (expected, not a defect)**: the builds carry no paid code-signing certificate (macOS is ad-hoc signed without Apple notarization; Windows has no Authenticode certificate), so the OS warns on first launch. macOS: System Settings > Privacy & Security > Open Anyway, or run `xattr -d com.apple.quarantine /Applications/Proxy429.app` once. Windows SmartScreen: More info > Run anyway. The warning returns after every update that replaces the app.'
          } > notes.md
          cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # -R pins the target repo explicitly; the checkout above exists for git log, not for gh
        # (an earlier no-checkout version died on "not a git repository").
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes-file notes.md -R "${{ github.repository }}"

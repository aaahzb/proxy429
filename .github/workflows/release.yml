# Release: pushing a v* tag builds all three platform artifacts in parallel and
# publishes them on a GitHub Release with auto-generated notes.
#   proxy429-windows-amd64.exe   (windows-latest, GUI subsystem via build.sh)
#   proxy429-linux-amd64.tar.gz  (ubuntu-latest, static CGO_ENABLED=0 binary + usage.md)
#   proxy429-macos-arm64.dmg     (macos-latest = Apple Silicon runner; build.sh assembles and
#                                 ad-hoc-signs Proxy429.app, then hdiutil packs a drag-to-Applications DMG)
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      - run: mv release/proxy429.exe release/proxy429-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: proxy429-windows-amd64.exe
          path: release/proxy429-windows-amd64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      # tar.gz keeps the executable bit, which plain artifact upload does not preserve.
      - run: tar -czf release/proxy429-linux-amd64.tar.gz -C release proxy429 usage.md
      - uses: actions/upload-artifact@v4
        with:
          name: proxy429-linux-amd64.tar.gz
          path: release/proxy429-linux-amd64.tar.gz

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: bash build.sh
      - name: Package DMG
        run: |
          mkdir -p dmg-staging
          cp -R release/Proxy429.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname Proxy429 -srcfolder dmg-staging -ov -format UDZO release/proxy429-macos-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: proxy429-macos-arm64.dmg
          path: release/proxy429-macos-arm64.dmg

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: proxy429-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes

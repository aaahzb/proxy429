# CI: re-run the local verification pipeline (vet, tests, gofmt, build.sh) on every
# push to main and every PR, on all three target platforms.
# macOS runs on Apple Silicon runners, which also natively satisfies the systray cgo (AppKit) build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # build.sh defaults GOPROXY to goproxy.cn; the canonical proxy is more reliable from GitHub runners.
  GOPROXY: https://proxy.golang.org,direct

jobs:
  check:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # One unambiguous platform line at the top of every job log. The matrix label says
      # x64 because that is the term Windows/Linux users recognize for amd64.
      - name: Show target platform
        run: echo "target platform: ${{ matrix.os }} (${{ matrix.arch }}), runner: ${{ runner.os }} (${{ runner.arch }})"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Repo blobs are stored LF (local checkouts may be CRLF via autocrlf), so an exact
      # gofmt check only works on a guaranteed-LF checkout: ubuntu.
      # Print the offenders before failing, or the log shows only "exit code 1".
      - name: gofmt check
        if: matrix.os == 'ubuntu-latest'
        run: |
          bad="$(gofmt -l .)"
          [ -z "$bad" ] || { echo "not gofmt-formatted:"; echo "$bad"; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build.sh
        run: bash build.sh

      # Headless end-to-end: mock upstream on 9099 + the just-built binary on 18083/18084 with -no-tray.
      - name: smoke test
        run: bash test/smoke/smoke.sh

      - name: proxycheck watchdog E2E (Windows-only)
        if: matrix.os == 'windows-latest'
        run: bash test/smoke/exe-watchdog.sh
